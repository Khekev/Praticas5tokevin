<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Descripción del proyecto para SEO">
  <title>Mi Proyecto - Landing Page</title>
</head>
<body>
  <header>
    <nav aria-label="Navegación principal">
      <a href="#hero">Inicio</a>
      <a href="#features">Características</a>
      <a href="#about">Acerca de</a>
      <a href="#contact">Contacto</a>
    </nav>
  </header>

  <main>
    <section id="hero" aria-labelledby="hero-title">
      <h1 id="hero-title">Nombre del Proyecto</h1>
      <p>Descripción breve y convincente del proyecto.</p>
      <a href="#contact">Contáctame</a>
    </section>

    <section id="features" aria-labelledby="features-title">
      <h2 id="features-title">Características</h2>
      <!-- Tarjetas de features -->
    </section>

    <section id="about" aria-labelledby="about-title">
      <h2 id="about-title">Acerca del Proyecto</h2>
      <!-- Contenido descriptivo -->
    </section>

    <section id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">Contacto</h2>
      <form id="contact-form" action="#" method="POST">
        <label for="name">Nombre</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Mensaje</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Mi Proyecto. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
